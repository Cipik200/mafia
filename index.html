
<!DOCTYPE html>
<html lang="ru" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мафия Онлайн</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-cinzel { font-family: 'Cinzel', serif; }
    </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100 overflow-x-hidden">

    <!-- ЛОББИ -->
    <div id="lobbyScreen" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center shadow-2xl">
            <h1 class="text-3xl font-cinzel font-bold text-red-500 mb-2">MAFIA ONLINE</h1>
            <p class="text-xs text-slate-400 mb-6">Создайте комнату или подключитесь по коду</p>
            
            <input type="text" id="playerNameInput" placeholder="Ваше имя..." class="w-full px-4 py-3 mb-4 bg-slate-950 border border-slate-800 rounded-xl outline-none text-sm text-center focus:border-red-500">
            
            <button onclick="createRoom()" class="w-full py-3 bg-red-600 hover:bg-red-500 font-semibold rounded-xl transition mb-3">
                Создать комнату
            </button>
            
            <div class="flex gap-2">
                <input type="text" id="roomIdInput" placeholder="Код комнаты..." class="flex-1 px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl outline-none text-sm text-center uppercase font-mono">
                <button onclick="joinRoom()" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-semibold transition">
                    Войти
                </button>
            </div>
        </div>
    </div>

    <!-- ИГРОВОЙ ЭКРАН -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex items-center justify-between">
        <h1 class="font-cinzel text-xl font-bold text-red-500">MAFIA ONLINE</h1>
        <div class="flex gap-2">
            <button id="copyLinkBtn" onclick="copyLink()" class="hidden px-3 py-1.5 bg-slate-800 text-xs rounded-lg border border-slate-700">Скопировать ссылку</button>
            <div id="playerCount" class="px-3 py-1.5 bg-red-950/50 text-red-400 border border-red-900/50 text-xs rounded-lg font-mono">Игроков: 1</div>
        </div>
    </header>

    <main class="flex-1 p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="videoGrid">
        <!-- Видео участников -->
    </main>

    <script>
        const PEER_CONFIG = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' }
                ]
            }
        };

        const state = {
            peer: null,
            myId: null,
            roomId: null,
            playerName: 'Игрок',
            stream: null,
            connections: {}
        };

        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const room = params.get('room');
            if (room) document.getElementById('roomIdInput').value = room;
        });

        async function initStream() {
            try {
                state.stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            } catch (e) {
                console.warn('Камера недоступна:', e);
            }
        }

        async function createRoom() {
            const name = document.getElementById('playerNameInput').value.trim();
            if (!name) return alert('Введите имя!');
            state.playerName = name;
            state.roomId = Math.random().toString(36).substring(2, 8).toLowerCase();
            
            await initStream();
            initPeer(state.roomId);
        }

        async function joinRoom() {
            const name = document.getElementById('playerNameInput').value.trim();
            const room = document.getElementById('roomIdInput').value.trim().toLowerCase();
            if (!name || !room) return alert('Введите имя и код комнаты!');
            state.playerName = name;
            state.roomId = room;

            await initStream();
            initPeer();
        }

        function initPeer(customId = null) {
            state.peer = customId ? new Peer(customId, PEER_CONFIG) : new Peer(PEER_CONFIG);

            state.peer.on('open', (id) => {
                state.myId = id;
                document.getElementById('lobbyScreen').classList.add('hidden');
                document.getElementById('copyLinkBtn').classList.remove('hidden');
                
                addVideoCard(state.myId, state.playerName + ' (Вы)', state.stream, true);

                if (!customId) {
                    connectToHost(state.roomId);
                }
            });

            state.peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    if (data.type === 'JOIN') {
                        state.connections[conn.peer] = conn;
                        updateCount();
                        if (state.stream) {
                            const call = state.peer.call(conn.peer, state.stream);
                            call.on('stream', (remoteStream) => addVideoCard(conn.peer, data.name, remoteStream));
                        }
                    }
                });
            });

            state.peer.on('call', (call) => {
                call.answer(state.stream);
                call.on('stream', (remoteStream) => {
                    addVideoCard(call.peer, 'Участник', remoteStream);
                });
            });

            state.peer.on('error', (err) => {
                if (err.type === 'peer-unavailable') {
                    alert('Комната с таким кодом не найдена! Убедитесь, что создатель комнаты сейчас на сайте.');
                } else {
                    alert('Ошибка связи: ' + err.type);
                }
            });
        }

        function connectToHost(hostId) {
            const conn = state.peer.connect(hostId);
            conn.on('open', () => {
                conn.send({ type: 'JOIN', name: state.playerName });
            });
        }

        function addVideoCard(id, name, stream, isSelf = false) {
            if (document.getElementById(`card-${id}`)) return;
            const grid = document.getElementById('videoGrid');
            const card = document.createElement('div');
            card.id = `card-${id}`;
            card.className = 'relative bg-slate-900 border border-slate-800 rounded-xl overflow-hidden aspect-video flex items-center justify-center';
            card.innerHTML = `
                <video id="vid-${id}" autoplay playsinline ${isSelf ? 'muted' : ''} class="w-full h-full object-cover"></video>
                <div class="absolute bottom-2 left-2 bg-slate-950/80 text-xs px-2 py-1 rounded border border-slate-800">${name}</div>
            `;
            grid.appendChild(card);
            
            const vid = document.getElementById(`vid-${id}`);
            if (stream) vid.srcObject = stream;
            updateCount();
        }

        function updateCount() {
            const count = document.querySelectorAll('#videoGrid > div').length;
            document.getElementById('playerCount').innerText = `Игроков: ${count}`;
        }

        function copyLink() {
            const url = `${window.location.origin}${window.location.pathname}?room=${state.roomId}`;
            navigator.clipboard.writeText(url);
            alert('Ссылка скопирована! Отправьте её друзьям.');
        }
    </script>
</body>
</html>
